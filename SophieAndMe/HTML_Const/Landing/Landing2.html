<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Dynamic Calendar JavaScript | CodingNepal</title>
    <link rel="stylesheet" href="Landing2.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font Link for Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

</head>
<body>
<div class="Main">
    <div class="FirstCol">
    <div>
        <div class="ContainerWelcome">
            <div class="Inner">
                <div class="Inner1">
                    <p class="Welcome">
                        Heureux de vous revoir, Admin 
                    </p>
                        <p class="UnderTitle"> Voici un aperçu rapide de votre semaine: progression, événements, et dernières notes.</p>
                </div>
            </div>
        </div>
    </div>
    </div>
    <div class="ContainerN" id="Nouveau">
        <div class="ClearContainer">
            <label class="Title">Messages</label>
<!--            <button class="OpenSlack">Ouvrir</button>-->
            <div class="Handler" id="Messages">
            </div>
        </div>
        <div class="ClearContainer">
            <label class="Title">Notes</label>
<!--            <button class="OpenSlack">Ouvrir</button>-->
            <div class="Handler" id="Notes">


            </div>
        </div>
        <div class="ClearContainer">
            <label class="Title">Quizz</label>
            <div class="Handler" id="Quizz">
            </div>
        </div>
    </div>
    <div class="chartProg">
        <div class="Chart">
            <label class="Title">Progressions</label>
            <div class="chart"></div>        
        </div>
    
        <div class="Progonly">
            <label class="Title">Matiére</label>
            <div class="MatProg">
                <label class="BarLabel1">Mathématiques</label>
                <div class="progress-bar Maths"><span id="Maths"></span></div>
            </div>
            <div class="MatProg">
                <label class="BarLabel">Physique</label>
                <div class="progress-bar Physique"><span id="Physique"></span></div>
            </div>
            <div class="MatProg">
                <label class="BarLabel">SI</label>
                <div class="progress-bar SI"><span id="SI"></span></div>
            </div>
            <div class="MatProg">
                <label class="BarLabel">Français</label>
                <div class="progress-bar Français"><span id="Français"></span></div>
            </div>
            <div class="MatProg">
                <label class="BarLabel">Anglais</label>
                <div class="progress-bar Anglais"><span id="Anglais"></span></div>
            </div>
            <div class="MatProg">
                <label class="BarLabel">Erreurs</label>
                <div class="progress-bar Erreurs"><span></span></div>
            </div>
        </div>
</div>
    <div class="ContainerCalendar">
        <div class="wrapper">
            <header>
                <p class="current-date"></p>
            </header>
            <div class="calendar">
                <ul class="weeks">
                    <li>Di</li>
                    <li>Lu</li>
                    <li>Ma</li>
                    <li>Me</li>
                    <li>Je</li>
                    <li>Ve</li>
                    <li>Sa</li>
                </ul>
                <ul class="days"></ul>
            </div>
        </div>
</div>

</div>
<script src="../ThemeMain.js" ></script>
<script src="Landing.js" ></script>
</body>
</html>
