<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Dynamic Calendar JavaScript | CodingNepal</title>
    <link rel="stylesheet" href="Landing.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font Link for Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="Landing.js" defer></script>
  </head>
  <body>
    <div class="Main">
      <div class="Container">
            <label class="Title">Progression</label>
            <div class="MainProgressions">
            <div class="chart">
              
            </div>
            <div class="MatProg">
                 <label class="BarLabel">Mathématiques</label>
                 <div class="progress-bar Maths"><span></span></div>
            </div>
                <div class="MatProg">
                 <label class="BarLabel">Physique</label>
                 <div class="progress-bar Physique"><span></span></div>
            </div>
                        <div class="MatProg">
                 <label class="BarLabel">SI</label>
                 <div class="progress-bar SI"><span></span></div>
            </div>
                 <div class="MatProg">
                 <label class="BarLabel">Français</label>
                 <div class="progress-bar Français"><span></span></div>
            </div>
                 <div class="MatProg">
                 <label class="BarLabel">Anglais</label>
                 <div class="progress-bar Anglais"><span></span></div>
            </div>
                  <div class="MatProg">
                 <label class="BarLabel">Erreurs</label>
                 <div class="progress-bar Erreurs"><span></span></div>
            </div>
            </div>
        </div>
        <div>
          <div class="ContainerWelcome">
              <div class="Inner">
                <label class="Welcome">
                  Welcome back, admin
                </label>
              </div>
        </div>
        <div class="ContainerCalendar">
          <div class="wrapper">
            <header>
              <p class="current-date"></p>
            
            </header>
            <div class="calendar">
              <ul class="weeks">
                <li>Di</li>
                <li>Lu</li>
                <li>Ma</li>
                <li>Me</li>
                <li>Je</li>
                <li>Ve</li>
                <li>Sa</li>
              </ul>
              <ul class="days"></ul>
            </div>
          </div>
        </div>
        </div>
        <div class="ContainerN" id="Nouveau">
            <label class="Title">Messages</label>
            <div class="Handler" id="Messages">
            </div> 
            <label class="Title">Notes</label>
            <div class="Handler" id="Notes">
            </div>
            <label class="Title">Quizz</label>
            <div class="Handler" id="Quizz">
            </div>

        </div>

        
    </div>
  </body>
</html>
