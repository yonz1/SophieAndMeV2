<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="Style2.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.0.1/es5/tex-mml-chtml.js"> </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div id="sidebar" >
    
</div>
<div class="stage" role="main">
    <aside class="sidebar" aria-label="Aperçu">
        <div class="logo">
            <div class="avatar" aria-hidden="true">U</div>
            <div>
                <div class="app-title">Personnaliser</div>
                <p>Créer des flashcards</p>
            </div>
        </div>
        
        <div style="height:18px"></div>
        <div class="muted">Raccourcis :</div>
        <ul style="padding-left:18px;margin-top:8px;color:var(--muted);font-size:13px;line-height:1.9">
            <li>Ctrl+Enter — Ajouter</li>
            <li>Esc — Effacer</li>
        </ul>
        <p style="margin-top:18px">Ajouées :</p>
        <p class="muted"></p>
        <ul style="padding-left:18px;margin-top:8px;color:var(--muted);font-size:13px;line-height:1.9" id="ulRecent">

        </ul>
    </aside>

    <section class="card" aria-labelledby="pageTitle">
        <h1 id="pageTitle">Créer une flashcard</h1>

        <fieldset>
        <div class="button-group">
            <input type="radio" id="svelt" name="frameworks" checked="" />
            <label for="svelt">Créer</label>
        </div>

        <div class="button-group">
            <input type="radio" id="react" name="frameworks" />
            <label for="react">Importer</label>
        </div>

        <div class="button-group">
            <input type="radio" id="vue" name="frameworks" />
            <label for="vue">Partage</label>
        </div>
        </fieldset>

        <form id="flashForm" autocomplete="off" novalidate>
            <div>
                <div class="section-title">Informations</div>

                <div class="row">
                    <div class="field full" style="grid-column:1 / -1;">
                        <input id="matiere" name="matiere" placeholder=" " aria-label="Matière" />
                        <label class="label" for="matiere">Matière</label>
                    </div>
                    
                    <div class="field" style="margin-top:6px;">
                        <input id="name" name="name" placeholder=" " aria-label="Nom" />
                        <label class="label" for="name">Nom</label>
                    </div>
                    <div style="min-width:10px"></div> <!-- spacer (align with two columns) -->
                </div>
            </div>

            <hr style="border:none;border-top:1px solid rgba(255,255,255,0.03);margin:10px 0 12px">

<!--            ##############################  Séparation information et card-->
            
            <div>
                <div class="section-title">Nouvelle flashcard
                    <label class="container">
                        <input type="checkbox" id="QuestionCheck" checked="CheckedQuestion()">
                        <svg class="eye" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 576 512"><path d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z"></path></svg>
                        <svg class="eye-slash" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 640 512"><path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"></path></svg>
                    </label></div>
                <div class="row2" style="align-items:start">

                    <!--####################################  Séparation Question et Réponse-->
                    
                    <div class="input-group">
                        <textarea  name="inputText" required="" type="text" name="text" autocomplete="off" class="input_nq" id="inputText" ></textarea>
                        <label for="inputText" class="user-label">Question</label>

                        <input type="file" style="display: none;" id="fileInput" />
                        <button class="Btn" id="searchImage_quest">
                            <svg class="svgIcon" viewBox="0 0 384 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path></svg>
                            <span class="icon2"></span>
                            <span class="tooltip">Download</span>
                        </button>
                    </div>
                    <div class="Show_data">
                        <img id="ques_img">
                        <p id="OutputText"  style="white-space: pre-wrap;"></p>
                    </div>
                    
                    
                    <div class="input-group">
                        <textarea name="input_rep" required="" type="text" name="text" autocomplete="off" class="input_nq" id="input_rep"></textarea>
                        <label for="input_rep" class="user-label">Réponse</label>

                        <input type="file" style="display: none;" id="fileInpu_rept" />
                        <button class="Btn" id="searchImage_rep">
                            <svg class="svgIcon" viewBox="0 0 384 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path></svg>
                            <span class="icon2"></span>
                            <span class="tooltip">Download</span>
                        </button>
                    </div>

                    <div class="Show_data">
                        <img id="rep_img">
                        <p id="Output_rep" style="white-space: pre-wrap;"></p>
                    </div>
                    
                </div>

<!--                <div class="muted">Vous pouvez ajouter des médias plus tard (icône à droite).</div>-->

                <div class="actions">
                    <button type="button" class="btn ghost" id="btnClear">CLEAR</button>
                    <button type="submit" class="btn primary" id="btnAdd">ADD</button>
                </div>
            </div>
        </form>
    </section>
</div>
<script src="Value.js"></script>
<script src="betterarea.js"></script>
</body>
</html>
